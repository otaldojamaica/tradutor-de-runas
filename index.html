<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tradutor de Runas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&family=Uncial+Antiqua&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>


<img src="logo.png" alt="Tradutor de Runas" class="site-logo">

<!-- ===================== TRADUTOR ===================== -->
<div class="view active" id="view-tradutor">
  <div class="panel">
    <div class="panel-header">
      <label for="wordInput">Texto</label>
      <button id="resetFlips">Limpar</button>
    </div>
    <input type="text" id="wordInput" placeholder="..." autocomplete="off">
  </div>

  <div class="canvas-wrap">
    <svg class="hand-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="hb-main" vector-effect="non-scaling-stroke" d="M 2.7,0.3
        C 40,-0.1 60,0.7 97.3,0.3
        C 98.6,0.4 99.7,1.4 99.7,8.6
        C 99.9,35 99.5,65 99.7,91.4
        C 99.7,98.6 98.6,99.6 97.3,99.7
        C 60,100.1 40,99.3 2.7,99.7
        C 1.4,99.6 0.3,98.6 0.3,91.4
        C 0.1,65 0.5,35 0.3,8.6
        C 0.3,1.4 1.4,0.4 2.7,0.3 Z"/>
      <path class="hb-echo" vector-effect="non-scaling-stroke" d="M 2.2,0.8
        C 42,0.1 58,1.2 97.8,0.7
        C 99.4,0.8 100.3,2.2 100.4,9.3
        C 100.7,34 99.1,66 100.4,90.7
        C 100.3,97.5 99.4,98.9 97.8,99.2
        C 58,99.8 42,98.7 2.2,99.2
        C 0.7,98.9 -0.3,97.5 -0.4,90.7
        C -0.7,66 0.9,34 -0.4,9.3
        C -0.3,2.2 0.7,0.8 2.2,0.8 Z"/>
    </svg>
    <div id="output"></div>
  </div>
</div>

<!-- ===================== FONT PICKER ===================== -->
<div class="font-picker" id="fontPicker">
  <select id="fontSelect" title="Fonte do idioma"></select>
  <button class="gear-btn" id="gearBtn" title="Configurações">
    <svg viewBox="0 0 512 512" fill="currentColor">
      <path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4l-55.7 17.7c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/>
    </svg>
  </button>
</div>

<!-- ===================== CONFIGURAÇÕES ===================== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <button class="modal-close" id="modalCloseBtn" aria-label="Fechar"></button>
    <div class="modal-title">Configurações</div>

    <div class="modal-scroll">
    <div class="modal-view active" id="modalview-imagem">

      <!-- Fonte -->
      <div class="bg-field">
        <span class="bg-field-label">Adicionar fonte (.otf)</span>
        <label class="icon-upload-btn" title="Enviar fonte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4.5 16.5v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"/></svg>
          <input type="file" id="fontImportFile" accept=".otf,font/otf" style="display:none">
        </label>
      </div>

      <!-- Site background -->
      <div class="bg-field">
        <span class="bg-field-label">Plano de fundo geral do site</span>
        <label class="icon-upload-btn" title="Enviar arquivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4.5 16.5v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"/></svg>
          <input type="file" id="bgSiteFile" accept="image/*">
        </label>
      </div>

      <!-- Translator background -->
      <div class="bg-field">
        <span class="bg-field-label">Fundo da área onde as runas aparecem</span>
        <label class="icon-upload-btn" title="Enviar arquivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4.5 16.5v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"/></svg>
          <input type="file" id="bgTranslatorFile" accept="image/*">
        </label>
      </div>

      <div class="modal-actions">
        <button id="clearFontsBtn">Limpar Fontes</button>
        <button id="bgResetBtn">Redefinir ao padrão</button>
      </div>
    </div>
    </div>

  </div>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
